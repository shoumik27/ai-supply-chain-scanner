[project]
name = "ai-supply-chain-scanner"
version = "1.0.0"
description = "Comprehensive CLI scanner for AI/LLM supply chain vulnerabilities"
authors = [{ name = "Shoumik Chandra" }]
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "huggingface_hub>=0.20",
    "transformers>=4.40",
    "requests",
    "pip-audit",
    "cryptography",
    "pyjwt",
    "schedule",
    "safety",
    "bandit",
]

[project.scripts]
ai-scan = "ai_supply_chain_scanner.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy"
]

[tool.setuptools.packages.find]
include = ["ai_supply_chain_scanner*"]
namespaces = false

[tool.setuptools]
package-dir = {"" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88